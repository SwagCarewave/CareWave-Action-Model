seed: 42
seeds:
- 42
- 52
- 62
data:
  raw_csi_dir: data/raw_csi
  labels_dir: data/labels
  events_path: data/metadata/action_events.csv
  processed_dir: data/processed/csi_stream_walk_v1
  scaler_path: data/preprocessing/csi_robust_scaler_train_only.npz
  target_fps: 10
  rx_ids:
  - RX1
  - RX2
  - RX3
  subcarriers_per_rx: 52
  input_dim: 315
  window_seconds: 3.0
  stride_seconds: 0.5
  max_time_gap_sec: 0.15
  classes:
  - standing
  - falling
  class_to_id:
    standing: 0
    falling: 1
  fall_pre_onset_sec: 0.5
  fall_post_impact_sec: 1.0
  fall_center_pre_onset_sec: 0.3
  fall_center_post_impact_sec: 0.8
  fall_overlap_threshold: 0.3
  standing_ratio_threshold: 0.8
  non_fall_ratio_threshold: 0.8
  hard_negative_labels:
  - walking
  - turning_body
  - lowering_arms
  - raising_arms
  - turning_head
  - adjusting_position
  hard_negative_weight: 4.0
  excluded_negative_labels:
  - lying
  - getting_up
  - transition
  - slow_lying_down
  - ignore
  boundary_weight: 0.5
  require_reviewed_events: true
  split:
    mode: session
    test_dir_name: test
    val_ratio: 0.2
    seed: 42
model:
  input_dim: 315
  conv_channels: 128
  kernel_size: 5
  tcn_blocks: 2
  gru_hidden: 96
  gru_layers: 1
  attention_hidden: 64
  dropout: 0.3
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 12
  gradient_clip: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 4
  num_workers: 0
  device: auto
  pos_weight: 1.0
  threshold: 0.5
  threshold_candidates:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  recall_floor: 0.85
augmentation:
  enabled: true
  gaussian_noise_std: 0.02
  feature_dropout: 0.03
  amplitude_scale_min: 0.95
  amplitude_scale_max: 1.05
  time_shift_frames: 1
preprocessing:
  use_first_model_scaler: true
  clip_min: -10.0
  clip_max: 10.0
postprocess:
  enabled: true
  ema_alpha: 0.6
  fall_threshold: 0.65
  confirm_count: 3
  confirm_window: 5
